name: Process Cache Diff
on:
  repository_dispatch:
    types: [check-cache-diff]
  workflow_dispatch:

jobs:
  rebuild-cache:
    runs-on: self-hosted
    steps:
      - name: Checkout Repo 2
        uses: actions/checkout@v4

      - name: Decode Payload & Check Diff
        id: diff_check
        if: github.event_name == 'repository_dispatch'
        run: |
          # Decode incoming cache state
          echo "${{ github.event.client_payload.cache_b64 }}" | base64 -d > incoming_cache.txt

          # Ensure baseline state file exists
          touch state_cache.txt

          # Compare state files
          if cmp -s incoming_cache.txt state_cache.txt; then
            echo "No changes detected. Skipping cache build."
            echo "has_diff=false" >> $GITHUB_OUTPUT
          else
            echo "Differences found between current state and incoming cache!"
            echo "has_diff=true" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Secondary Boot Disk Image
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            CACHE_FILE="state_cache.txt"
          else
            CACHE_FILE="incoming_cache.txt"
          fi
          cd gke-tools/gke-disk-image-builder
          go run ./cli \
          --project-name="${{ vars.GCP_PROJECT_ID }}" \
          --image-name="analyser-cache-$(date +%Y%m%d)-$(openssl rand -hex 6)" \
          --zone=europe-west1-c \
          --image-pull-auth=RegistryCredentials \
          --registry-credentials="aivetech:${{ secrets.DOCKER_AUTH_TOKEN }}" \
          --network=vpc \
          --subnet=subnet \
          --disk-size-gb=100 \
          --timeout=1h \
          --container-image-file="$CACHE_FILE"
      
      - name: Commit New State
        if: steps.diff_check.outputs.has_diff == 'true'
        run: |
          cp incoming_cache.txt state_cache.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_cache.txt
          git commit -m "chore: update cache state [skip ci]"
          git push